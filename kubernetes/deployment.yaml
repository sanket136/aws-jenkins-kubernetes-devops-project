apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: sanket9401/aws-jenkins-kubernetes-devops-project:latest
          ports:
            - containerPort: 80
